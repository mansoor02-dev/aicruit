
services:
  postgres:
    image: postgres:15
    container_name: aicruit_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: aicruit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4
    container_name: aicruit_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aicruit.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  
  file-service:
    build:
      context: ../../services/file-service
    container_name: aicruit_file_service
    ports:
      - "8005:8005"
    volumes:
      - ../../services/file-service/uploads:/app/uploads
    environment:
      DB_NAME: aicruit
      DB_USER: admin
      DB_PASS: admin123
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres

  db-init:
    build:
      context: ../../database
      dockerfile: Dockerfile
    container_name: aicruit_db_init
    environment:
      DB_NAME: aicruit
      DB_USER: admin
      DB_PASS: admin123
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres
    restart: "no"
    # Keep schema available inside container (optional: the image copies it already)
    volumes:
      - ../../database/schema.sql:/app/schema.sql:ro

  resume-parser:
    build:
      context: ../../services/resume-parser
    container_name: aicruit_resume-parser
    ports:
      - "8006:8006"
    env_file:
      - ../../services/resume-parser/app/.env
    environment:
      DB_NAME: aicruit
      DB_USER: admin
      DB_PASS: admin123
      DB_HOST: postgres
      DB_PORT: 5432
      FILE_SERVICE_URL: http://aicruit_file_service:8005
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql+psycopg2://admin:admin123@postgres:5432/aicruit
    depends_on:
      - postgres
      - file-service
    volumes:
      - ../../services/resume-parser/parsed:/app/parsed
  backend-router:
    image: aicruit/api-gateway:local
    build:
      context: ../../gateway
    container_name: aicruit_backend_router
    ports:
      - "8000:8000"
    env_file:
      - ../../gateway/.env
    environment:
      RESUME_PARSER_URL: http://aicruit_resume-parser:8006
      FILE_SERVICE_URL: http://aicruit_file_service:8005
      DB_NAME: aicruit
      DB_USER: admin
      DB_PASS: admin123
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      # Mount host AWS credentials into container so the gateway can access AWS configs
      # Use USERPROFILE for Windows hosts; Docker will expand it
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      - postgres
      - resume-parser
      - file-service

  audio-transcribe:
    build:
      context: ../../services/transcribe-audio
    container_name: aicruit_audio_transcribe
    ports:
      - "8007:8007"
    env_file:
      - ../../services/transcribe-audio/app/.env
    environment:
      UPLOAD_DIR: /tmp/uploads
      PY_WHISPER_MODEL: small
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GROQ_API_KEY: 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
    depends_on:
      - file-service
    restart: always

  question-generation:
    build:
      context: ../../services/question-generation
    container_name: aicruit_question_generation
    ports:
      - "8010:8010"
    env_file:
      - ../../services/question-generation/.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../services/question-generation/cache:/app/cache
      - ../../services/question-generation/data:/app/data
      - ../../services/question-generation/logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  pgadmin_data:
