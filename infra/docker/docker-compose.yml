# ----------------------------------------------------------------------
# May 2026 — local-LLM removal + GCP-ready
# Removed faster-whisper / llama-cpp / Piper / sentence-transformers from
# services. Resume-parser uses Gemini, transcribe-audio uses Groq, TTS
# uses Google Cloud TTS, embeddings use Gemini. file-service gained a
# STORAGE_BACKEND switch; gateway no longer mounts the uploads volume.
# ----------------------------------------------------------------------
# Prior optimizations (kept):
# 1. Service discovery via compose service names (e.g. http://file-service:8005).
# 2. depends_on uses `condition: service_healthy` where applicable.
# 3. Healthchecks use python urllib (no curl in slim images).
# 4. Secrets pulled from env_file, not hardcoded.
# 5. Variable substitutions with fallbacks for DB credentials.
# 6. Cross-platform mounts: ${HOME:-${USERPROFILE}}.
# 7. Memory limits to prevent OOM on low-RAM hosts.
# 8. pgvector/pgvector:pg15 — vector extension built-in.
# ----------------------------------------------------------------------

services:
  postgres:
    image: pgvector/pgvector:pg15
    shm_size: 256mb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-aicruit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-aicruit}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aicruit.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  db-init:
    build:
      context: ../../database
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DB_NAME: ${POSTGRES_DB:-aicruit}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASS: ${POSTGRES_PASSWORD:-admin123}
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../database/schema.sql:/app/schema.sql:ro

  file-service:
    build:
      context: ../../services/file-service
    restart: always
    ports:
      - "8005:8005"
    volumes:
      - ../../services/file-service/uploads:/app/uploads
    environment:
      DB_NAME: ${POSTGRES_DB:-aicruit}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASS: ${POSTGRES_PASSWORD:-admin123}
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://admin:admin123@postgres:5432/aicruit}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_DIR: /app/uploads
      FILE_SERVICE_PUBLIC_URL: ${FILE_SERVICE_PUBLIC_URL:-http://localhost:8005}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  resume-parser:
    build:
      context: ../../services/resume-parser
    restart: always
    ports:
      - "8006:8006"
    env_file:
      - ../../services/resume-parser/.env
    environment:
      DB_NAME: ${POSTGRES_DB:-aicruit}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASS: ${POSTGRES_PASSWORD:-admin123}
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://admin:admin123@postgres:5432/aicruit}
      FILE_SERVICE_URL: http://file-service:8005
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemini-2.5-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
    depends_on:
      postgres:
        condition: service_healthy
      file-service:
        condition: service_healthy
    volumes:
      - ../../services/resume-parser/parsed:/app/parsed
      - ../../shared:/app/shared:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  backend-router:
    image: aicruit/api-gateway:local
    build:
      context: ../../gateway
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../../gateway/.env
    environment:
      RESUME_PARSER_URL: http://resume-parser:8006
      FILE_SERVICE_URL: http://file-service:8005
      FILE_SERVICE_PUBLIC_URL: ${FILE_SERVICE_PUBLIC_URL:-http://localhost:8005}
      QUESTION_GEN_URL: http://question-generation:8010
      TTS_URL: http://text-to-speech:8011
      TRANSCRIBE_URL: http://audio-transcribe:8007
      REPORT_GEN_URL: http://report-generation:8012
      DB_NAME: ${POSTGRES_DB:-aicruit}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASS: ${POSTGRES_PASSWORD:-admin123}
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://admin:admin123@postgres:5432/aicruit}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-google/gemini-flash-2.0}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
    volumes:
      - ${HOME:-${USERPROFILE}}/.aws:/root/.aws:ro
      - ../../shared:/app/shared:ro
      # Note: snapshot uploads now POST to file-service via API; the
      # gateway no longer needs to mount the uploads dir directly.
    depends_on:
      postgres:
        condition: service_healthy
      file-service:
        condition: service_started
      resume-parser:
        condition: service_started
      question-generation:
        condition: service_started
      text-to-speech:
        condition: service_started
      audio-transcribe:
        condition: service_started
      report-generation:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  audio-transcribe:
    build:
      context: ../../services/transcribe-audio
    restart: always
    ports:
      - "8007:8007"
    env_file:
      - path: ../../services/transcribe-audio/app/.env
        required: false
    environment:
      UPLOAD_DIR: /tmp/uploads
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  question-generation:
    build:
      context: ../../services/question-generation
    restart: always
    ports:
      - "8010:8010"
    env_file:
      - ../../services/question-generation/.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://admin:admin123@postgres:5432/aicruit}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMS: "768"
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-google/gemini-flash-2.0}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
    volumes:
      - ../../services/question-generation/cache:/app/cache
      - ../../services/question-generation/data:/app/data
      - ../../services/question-generation/logs:/app/logs
      - ../../shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      resume-parser:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 300s

  text-to-speech:
    build:
      context: ../../services/text-to-speech
    restart: always
    ports:
      - "8011:8011"
    env_file:
      - path: ../../services/text-to-speech/.env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      TTS_VOICE: en-US-Neural2-J
      TTS_SPEAKING_RATE: "1.0"
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ${HOME:-${USERPROFILE}}/.config/aicruit/gcp-sa.json:/secrets/gcp-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8011/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  report-generation:
    build:
      context: ../../services/report-generation
    restart: always
    ports:
      - "8012:8012"
    env_file:
      - path: ../../services/report-generation/.env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://admin:admin123@postgres:5432/aicruit}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-google/gemini-flash-2.0}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
    volumes:
      - ../../shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8012/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  pgdata:
  pgadmin_data:

